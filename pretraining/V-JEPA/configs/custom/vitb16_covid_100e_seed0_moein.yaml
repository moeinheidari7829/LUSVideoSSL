app: vjepa
nodes: 1
tasks_per_node: 1

data:
  dataset_type: VideoDataset
  datasets:
    - /arc/project/st-ilker-1/junbo2/code/jepa/data/covid_blues_all.csv
  decode_one_clip: true
  batch_size: 8
  num_clips: 1
  num_frames: 16
  tubelet_size: 2
  sampling_rate: 2
  crop_size: 224
  patch_size: 16
  pin_mem: true
  num_workers: 8
  filter_short_videos: false
  clip_duration: null

data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
    - 0.75
    - 1.35
  random_resize_scale:
    - 0.3
    - 1.0
  reprob: 0.0

logging:
  folder: /scratch/st-ilker-1/moein/junbo2_backup/vjepa_base_100e_seed0
  write_tag: vjepa_base_100e_seed0

loss:
  loss_exp: 1.0
  reg_coeff: 0.0

mask:
  - aspect_ratio: [0.75, 1.5]
    num_blocks: 8
    spatial_scale: [0.15, 0.15]
    temporal_scale: [1.0, 1.0]
    max_temporal_keep: 1.0
    max_keep: null
  - aspect_ratio: [0.75, 1.5]
    num_blocks: 2
    spatial_scale: [0.7, 0.7]
    temporal_scale: [1.0, 1.0]
    max_temporal_keep: 1.0
    max_keep: null

meta:
  load_checkpoint: false
  read_checkpoint: null
  seed: 0
  eval_freq: 100
  use_sdpa: false
  dtype: float16

model:
  model_name: vit_base
  pred_depth: 12
  pred_embed_dim: 384
  uniform_power: true
  use_mask_tokens: true
  zero_init_mask_tokens: true

optimization:
  ipe_scale: 1.0
  clip_grad: 10.0
  weight_decay: 0.04
  final_weight_decay: 0.4
  epochs: 100
  warmup: 10
  start_lr: 0.00001
  lr: 0.0001
  final_lr: 0.000001
  ema: [0.998, 1.0]
